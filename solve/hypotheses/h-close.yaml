# Hypothesis file (data only; read by solve/score.py). Priors and sources written 10/31/2026 before any fit.
id: H-CLOSE
label: Close small object
description: >
  A small object (bird, small drone, balloon or debris) within 2 nmi of the jet, much
  closer than it looks. Small size and nearness trade off: a close small object and a
  distant large one subtend the same angle.
model: close_object
applies_to: [GIMBAL, FLIR1]
parameters:
  range_ref_nmi:
    prior: loguniform
    bounds: [0.05, 2.0]
    source: "Design table: 0.05 to 2 nmi."
  airspeed_kt:
    prior: uniform
    bounds: [0.0, 80.0]
    source: "S1: birds 16 to 45 kt cruising (fast flapping fliers about 60 kt); S2: small drones up to about 40 kt; balloons and debris 0 (they move with the wind)."
  heading_deg:
    prior: uniform
    bounds: [0.0, 360.0]
    periodic: true
    source: "Any direction."
  vz_fpm:
    prior: normal
    mean: 0.0
    sd: 500.0
    bounds: [-2000.0, 2000.0]
    source: "S1: a few m/s of climb or sink at most for small fliers."
checks:
  - quantity: implied_size_upper_m
    min: 0.1
    max: 2.0
    source: "Design table: size 0.1 to 2 m. Reported as a check (the normalized size trend cannot see absolute size); the blob length is an upper bound."
sources:
  S1: "Alerstam T. et al. (2007), Flight speeds among bird species: allometric and phylogenetic effects, PLoS Biology 5(8): e197."
  S2: "DJI Phantom 3 (2015) specifications: maximum level speed 16 m/s (31 kt)."
