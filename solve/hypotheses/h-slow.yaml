# Hypothesis file (data only; read by solve/score.py). Priors and sources written 10/31/2026 before any fit.
id: H-SLOW
label: Slow object (bird or small drone)
description: >
  A slow flier, such as a bird or a small drone, at whatever range the data imply. It
  moves through the air at up to 60 kt in any direction and is carried by the wind; its
  apparent speed in the video is mostly parallax from the jet's motion.
model: slow_mover
applies_to: [GOFAST, GIMBAL]
parameters:
  range_ref_nmi:
    prior: loguniform
    bounds: [0.1, 25.0]
    source: "Any trackable range; the range readout, where shown, decides."
  airspeed_kt:
    prior: uniform
    bounds: [0.0, 60.0]
    source: "S1: cruising airspeeds of 138 bird species span 8 to 23 m/s (16 to 45 kt); S2: small consumer drones of 2015 reach about 30 to 40 kt. 60 kt covers both with margin (design table)."
  heading_deg:
    prior: uniform
    bounds: [0.0, 360.0]
    periodic: true
    source: "No information; any direction through the air."
  vz_fpm:
    prior: normal
    mean: 0.0
    sd: 500.0
    bounds: [-2000.0, 2000.0]
    source: "S1: sustained climb and descent rates of flying birds are a few m/s at most (500 ft/min is 2.5 m/s)."
checks:
  - quantity: implied_size_upper_m
    min: 0.1
    max: 3.0
    source: "S1, S2: birds 0.1 to 2 m wingspan, small drones 0.2 to 0.6 m; the blob length is an upper bound."
sources:
  S1: "Alerstam T., Rosen M., Backman J., Ericson P. G. P., Hellgren O. (2007), Flight speeds among bird species: allometric and phylogenetic effects, PLoS Biology 5(8): e197, doi:10.1371/journal.pbio.0050197."
  S2: "DJI Phantom 3 (2015) specifications: maximum level speed 16 m/s (31 kt); later consumer quadcopters about 20 m/s (39 kt)."
