    url: "https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/html/CHRG-118hhrg53022.htm (PDF: https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/pdf/CHRG-118hhrg53022.pdf)"
  verification: "read directly: official GPO transcript text and PDF"
  location_in_source: "printed p. 42 (PDF p. 46), answer to Langworthy"
  claim: "In the pod video there is no infrared plume and no visible sign of propulsion; the object was 'just sitting in space at 20,000 feet'."
  quote: "There is no IR plume coming out"
  quantity: "IR signature; altitude of object in video"
  value: "no exhaust plume visible in FLIR1; object at about 20,000 ft"
  uncertainty: "Fravor was not in the video aircraft. The 20,000 ft figure is in conflict with the 28,000 ft radar altitude."
  applies_to: [FLIR1]
  conflicts_with: [T-T42]
  notes: "This is a testable statement about the FLIR1 imagery: look for a plume or hot exhaust core. Fravor in the same answer says Underwood went through EO and IR modes."

