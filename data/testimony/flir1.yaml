- id: T-T12
  witness: "Cmdr. David Fravor (CO, VFA-41, lead F/A-18F pilot, 2004)"
  firsthand: false
  firsthand_detail: "Relaying the second crew (Underwood's aircraft) after they landed."
  source:
    title: "Unidentified Anomalous Phenomena: Implications on National Security, Public Safety, and Government Transparency (hearing, Serial No. 118-53)"
    outlet: "U.S. House Oversight Subcommittee on National Security, the Border, and Foreign Affairs; official GPO transcript"
    date: "07/26/2023"
    url: "https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/html/CHRG-118hhrg53022.htm (PDF: https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/pdf/CHRG-118hhrg53022.pdf)"
  verification: "read directly: official GPO transcript text and PDF"
  location_in_source: "printed p. 21 (PDF p. 25), answer to Burchett; the same account at printed pp. 41-42 (PDF pp. 45-46), answer to Langworthy"
  claim: "The crew that launched after Fravor landed saw significant jamming of their APG-73 radar (range, velocity and aspect, then a split lock) and then switched to the passive targeting pod, which recorded the video."
  quote: "experienced significant jamming to the APG-73 radar"
  quantity: "radar track behavior; sensor used"
  value: "radar lock lost or split; pod video taken with the pod passive"
  uncertainty: "Relayed; the radar tape Fravor mentions has never been released."
  applies_to: [FLIR1]
  conflicts_with: [T-T59]
  notes: "Underwood's own reported account (Corbell interview, via forum posts) mentions jamming cues on his radar tape and that Princeton and E-2 lost the contact when he lost FLIR track."

- id: T-T13
  witness: "Cmdr. David Fravor (CO, VFA-41, lead F/A-18F pilot, 2004)"
  firsthand: false
  firsthand_detail: "Relaying what Underwood saw on the FLIR (not Fravor's own sensor)."
  source:
    title: "Unidentified Anomalous Phenomena: Implications on National Security, Public Safety, and Government Transparency (hearing, Serial No. 118-53)"
    outlet: "U.S. House Oversight Subcommittee on National Security, the Border, and Foreign Affairs; official GPO transcript"
