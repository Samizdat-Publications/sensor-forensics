# FLIR1 ("Tic Tac"), USS Nimitz group, 11/14/2004: public testimony constraints.
# Generated and hand-checked for work item M3.3 on 10/31/2026. See README.md for the field list and SOURCES.md for the source list.
# No transcripts are copied; each claim is a paraphrase plus at most one quote under 15 words.
# Time of first sighting is not stated by the aircrew; the leaked CVW-11 log (unverified) says 1430 local.

- id: T-T01
  witness: "Cmdr. David Fravor (CO, VFA-41, lead F/A-18F pilot, 2004)"
  firsthand: false
  firsthand_detail: "Relaying what the Princeton controller told the crew by radio; Fravor did not see the radar."
  source:
    title: "Unidentified Anomalous Phenomena: Implications on National Security, Public Safety, and Government Transparency (hearing, Serial No. 118-53)"
    outlet: "U.S. House Oversight Subcommittee on National Security, the Border, and Foreign Affairs; official GPO transcript"
    date: "07/26/2023"
    url: "https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/html/CHRG-118hhrg53022.htm (PDF: https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/pdf/CHRG-118hhrg53022.pdf)"
  verification: "read directly: official GPO transcript text and PDF"
  location_in_source: "printed p. 13 (PDF p. 17), Fravor opening statement"
  claim: "The Princeton controller told the crew that the radar contacts had been observed for over two weeks, coming down from over 80,000 ft, descending rapidly to about 20,000 ft, hanging there for hours, then going straight back up."
  quote: "coming down from over 80,000 feet"
  quantity: "radar track behavior; altitude; duration"
  value: "over 80,000 ft down to about 20,000 ft; hang for hours; observed over 2 weeks"
  uncertainty: "Relayed radio recollection 19 years later. Altitude figures are the controller's, not measured by Fravor. Treat the hang altitude as 20,000 ft plus or minus 8,000 ft given the other accounts."
  applies_to: [FLIR1]
  conflicts_with: [T-T41, T-T42, T-T58, T-T64, T-T71]
  notes: "Day (the radar supervisor) says the intercepted contact was at 28,000 ft and that he did not himself see anything at 80,000 ft. The 80,000 ft figure is relayed in both accounts."

- id: T-T02
  witness: "Cmdr. David Fravor (CO, VFA-41, lead F/A-18F pilot, 2004)"
  firsthand: true
  firsthand_detail: "Own aircraft altitude (cockpit instruments, remembered)."
  source:
    title: "Unidentified Anomalous Phenomena: Implications on National Security, Public Safety, and Government Transparency (hearing, Serial No. 118-53)"
    outlet: "U.S. House Oversight Subcommittee on National Security, the Border, and Foreign Affairs; official GPO transcript"
    date: "07/26/2023"
    url: "https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/html/CHRG-118hhrg53022.htm (PDF: https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/pdf/CHRG-118hhrg53022.pdf)"
  verification: "read directly: official GPO transcript text and PDF"
  location_in_source: "printed p. 13 (PDF p. 17), Fravor opening statement"
  claim: "The two F/A-18Fs arrived at the location at about 20,000 ft, and the controller called 'merge plot'."
  quote: "We arrived at the location at approximately 20,000 feet"
  quantity: "altitude (own aircraft); radar track behavior (merge plot)"
  value: "about 20,000 ft"
  uncertainty: "Plus or minus 2,000 ft (memory, 19 years; same figure in 2018 and 2020 accounts)."
  applies_to: [FLIR1]
  conflicts_with: [T-T42]
  notes: "Merge plot means the radar blips of aircraft and contact were in the same resolution cell. Day says the intercepted contact was at 28,000 ft at that point, which would put it 8,000 ft above Fravor's own altitude."

- id: T-T03
  witness: "Cmdr. David Fravor (CO, VFA-41, lead F/A-18F pilot, 2004)"
  firsthand: true
  firsthand_detail: "Visual, from the cockpit."
  source:
    title: "Unidentified Anomalous Phenomena: Implications on National Security, Public Safety, and Government Transparency (hearing, Serial No. 118-53)"
    outlet: "U.S. House Oversight Subcommittee on National Security, the Border, and Foreign Affairs; official GPO transcript"
