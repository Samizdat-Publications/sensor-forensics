- id: T-T04
  witness: "Cmdr. David Fravor (CO, VFA-41, lead F/A-18F pilot, 2004)"
  firsthand: true
  firsthand_detail: "Naked eye, from the cockpit, with the WSO and the second aircraft's crew."
  source:
    title: "Unidentified Anomalous Phenomena: Implications on National Security, Public Safety, and Government Transparency (hearing, Serial No. 118-53)"
    outlet: "U.S. House Oversight Subcommittee on National Security, the Border, and Foreign Affairs; official GPO transcript"
    date: "07/26/2023"
    url: "https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/html/CHRG-118hhrg53022.htm (PDF: https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/pdf/CHRG-118hhrg53022.pdf)"
  verification: "read directly: official GPO transcript text and PDF"
  location_in_source: "printed p. 13 (PDF p. 17), Fravor opening statement"
  claim: "All four aircrew in the two jets looked down and saw a white Tic Tac shaped object with its long axis pointing north-south, moving very abruptly over the water."
  quote: "like a ping pong ball"
  quantity: "shape; heading (long axis); motion character; number of observers"
  value: "elongated white capsule; long axis N-S; 4 aircrew saw it"
  uncertainty: "Heading is a remembered long-axis orientation; plus or minus 30 degrees is a fair band."
  applies_to: [FLIR1]
  conflicts_with: [T-T27, T-T46]
  notes: "Said 'moving very abruptly over the water like a ping pong ball'. Dietrich says she had visual contact for only 8 to 10 seconds (see conflict)."

