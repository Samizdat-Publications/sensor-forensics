  verification: "read directly: official GPO transcript text and PDF"
  location_in_source: "printed p. 13 (PDF p. 17), Fravor opening statement"
  claim: "Fravor and his WSO descended in a circle (about 90 degrees, then another 270 degrees, nose low). Partway down the object shifted its long axis to align with his aircraft and began to climb toward him."
  quote: "aligned it with my aircraft, and began to climb"
  quantity: "relative motion; heading; maneuver geometry"
  value: "descent through about 360 degrees of turn; object turned to face jet and climbed"
  uncertainty: "Turn angles are rough memory ('about 90', 'another 270'); plus or minus 45 degrees each."
  applies_to: [FLIR1]
  conflicts_with: [T-T48]
  notes: "Fravor's hearing account has no barrel roll. Day says Fravor told him on the beach that the object 'barrel rolled' around him."

