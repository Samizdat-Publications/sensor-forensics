- id: F-T03
  witness: "Lt. Ryan Graves (F/A-18F pilot, VFA-11, USS Theodore Roosevelt, 2014 to 2015) (and two other speakers named in the thread)"
  firsthand: false
  firsthand_detail: "Description of the sensor mode, second-hand through a forum summary."
  source:
    title: "\"GO FAST\" Footage from Tom DeLonge's To The Stars Academy. Bird? Balloon? (forum thread, page 13, posts 301-518 quoting Graves, Lemoine and Lehto)"
    outlet: "Metabunk forum (secondary; the quoted videos were not opened)"
    date: "11/21/2024 to 11/23/2024 (post dates)"
    url: "https://www.metabunk.org/threads/go-fast-footage-from-tom-delonges-to-the-stars-academy-bird-balloon.9569/page-13"
  verification: "relayed: Metabunk post 488 summarizing; no direct Graves quote appears on the page"
  location_in_source: "forum posts 481, 488 and 301 to 318 (video timestamps not given)"
  claim: "Graves, Lehto and Lemoine are said to have described the on-screen range as ATFLIR passive ranging rather than radar; another poster recalls the range coming from a laser, another recalls 'trig'."
  quantity: "sensor used for the RNG readout"
  value: "passive (computed) ranging, not radar"
  uncertainty: "Very weak: three paraphrases by forum posters who disagree. The lab should read the RNG field's behavior directly from the frames instead."
  applies_to: [GOFAST]
  conflicts_with: []
  notes: "The AARO appendix reads the RNG value as a tracker range. This claim matters because passive range from a flat-Earth angle model is itself a model output."
  also_in:
    - source: "Joe Rogan Experience #2244 - Ryan Graves (The Joe Rogan Experience (PowerfulJRE, YouTube), 12/17/2024)"
      url: "https://www.youtube.com/watch?v=P4t8UgcjKfM"
      location_in_source: "00:28:23"
      verification: "read directly: YouTube auto-generated captions (en), fetched as text only on 10/31/2026; timestamps are caption times and the wording can be mis-heard"
      note: "Graves 2024, read directly: the range shown in the Go Fast video, range 3.4, comes from the ATFLIR sensor itself and is not a very reliable indicator of the range; the radar is the range sensor. So the on-screen range is a pod value."

