# GOFAST (January 2015, F/A-18F, ATFLIR, range on screen): public testimony constraints.
# Generated and hand-checked for work item M3.3 on 10/31/2026. See README.md and SOURCES.md.
# M3.3b (10/31/2026): claims F-T04 to F-T11 come from long-form interviews (Graves on Rogan #2244, Fravor on Lex Fridman #122) read through YouTube auto-captions; the earlier statement that GOFAST has almost no specific testimony still holds for aircrew who were on the flight (no one from the recording crew has been interviewed at length in the sources found). See README.md.
# There is almost no GOFAST-specific aircrew testimony in public sources. The East Coast class-of-objects claims that also bear on GOFAST are in gimbal.yaml
# (applies_to includes GOFAST): G-T04, G-T05, G-T16, G-T17, G-T22, G-T23.
# No transcripts are copied; each claim is a paraphrase plus at most one quote under 15 words.

