- id: G-T04
  witness: "Lt. Ryan Graves (F/A-18F pilot, VFA-11, USS Theodore Roosevelt, 2014 to 2015)"
  firsthand: true
  firsthand_detail: "Own radar and ATFLIR observations of East Coast objects, 2014 to 2015 (general; not specifically GIMBAL)."
  source:
    title: "Unidentified Anomalous Phenomena: Implications on National Security, Public Safety, and Government Transparency (hearing, Serial No. 118-53)"
    outlet: "U.S. House Oversight Subcommittee on National Security, the Border, and Foreign Affairs; official GPO transcript"
    date: "07/26/2023"
    url: "https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/html/CHRG-118hhrg53022.htm (PDF: https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/pdf/CHRG-118hhrg53022.pdf)"
  verification: "read directly: official GPO transcript text and PDF"
  location_in_source: "printed p. 19 (PDF p. 23), answer to Burchett"
  claim: "The objects in the working area showed 0.0 Mach (zero airspeed) over particular ground locations and stayed stationary in category-four hurricane winds, like a bobber in a river that is not carried downstream; the same objects would accelerate to supersonic speeds, 1.1 to 1.2 Mach."
  quote: "completely stationary in category four hurricane winds"
  quantity: "wind behavior; speed; ground speed vs air speed"
  value: "stationary over the ground in winds above about 115 kt (Category 4 = 113 to 136 mph sustained); bursts to Mach 1.1 to 1.2"
  uncertainty: "General statement about the whole East Coast class of contacts. Speeds are radar-derived and relayed by memory. Mismatch with GIMBAL's 120 kt wind is only suggestive."
  applies_to: [GIMBAL, GOFAST]
  conflicts_with: [G-T05]
  notes: "A stationary ground speed in a strong wind is the opposite of balloon-like downwind drift, so it is directly relevant to the parallax and balloon hypotheses (D-010). It describes the class of objects, not a specific frame range."

