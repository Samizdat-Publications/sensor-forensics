      note: "Graves 2022: stationary up to about 120 knots of airspeed at altitude (130 to 140 mph); completely stationary with a 140 mile an hour wind."
    - source: "Joe Rogan Experience #2244 - Ryan Graves (The Joe Rogan Experience (PowerfulJRE, YouTube), 12/17/2024)"
      url: "https://www.youtube.com/watch?v=P4t8UgcjKfM"
